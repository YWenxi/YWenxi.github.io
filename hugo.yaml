baseURL: https://ywenxi.github.io/
locale: en-us
title: ywenxi 
theme: ["PaperMod"]


params:
  env: production
  description: "My Personal Website. 🚧 Under Construction... 🚧"
  author: ywenxi

  math: true

  defaultTheme: auto

  ShowShareButtons: false
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowToc: true

  homeInfoParams:
    Title: "Wenxi Yang"
    Content: |
      **🚧 Under Construction 🚧**

      I am a Ph.D. candidate of LAMP (Learning And Machine Perception) in University of Chinese Academy of Sciences, advised by [Prof. Qixiang Ye](https://people.ucas.ac.cn/~qxye).

      My research interests include vision language models and deep learning methods, specifically in post-training on vision language models and visual agents.

  socialIcons:
    - name: github
      title: My Github Page
      url: "https://github.com/YWenxi"
    - name: Email
      title: Send me an email
      url: "mailto:yangwenxi24@mails.ucas.ac.cn"
    - name: Discord
      title: Join discord community
      url: "https://discord.gg/ahpmTvhVmp"

menu:
      main:
        - name: About
          url: about
          weight: 1
        - name: Blogs
          url: blog/
          weight: 2
        - name: Research
          url: research/
          weight: 2
        - name: Tags
          url: tags/
          weight: 4

taxonomies:
    category: categories
    tag: tags
    series: series

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
          - - '\['
            - '\]'
          - - $$
            - $$
          inline:
          - - '\('
            - '\)'
          - - $
            - $
        enable: true
  highlight:
    noClasses: false

caches:
  images:
    dir: :cacheDir/images